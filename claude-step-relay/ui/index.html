<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>step-relay 任务看板</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e3e3e6;
    --text: #1c1c1f;
    --muted: #6b6b74;
    --accent: #4f46e5;
    --pending: #9ca3af;
    --executing: #2563eb;
    --done: #16a34a;
    --blocked: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1e1e23;
      --border: #2e2e35;
      --text: #e8e8ea;
      --muted: #9a9aa2;
      --accent: #818cf8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .refresh {
    font-size: 12px; color: var(--muted); cursor: pointer;
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
    background: var(--panel);
  }
  header .refresh:hover { color: var(--accent); border-color: var(--accent); }
  main { flex: 1; display: flex; overflow: hidden; }
  #task-list {
    width: 300px; flex-shrink: 0; overflow-y: auto;
    border-right: 1px solid var(--border); background: var(--panel);
  }
  .task-item {
    padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .task-item:hover { background: var(--bg); }
  .task-item.active { background: var(--bg); border-left: 3px solid var(--accent); }
  .task-item .title { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .task-item .meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 6px;
    border-radius: 999px; text-transform: uppercase; letter-spacing: .02em;
  }
  .badge.open { background: rgba(37,99,235,.12); color: var(--executing); }
  .badge.done { background: rgba(22,163,74,.12); color: var(--done); }
  #detail { flex: 1; overflow-y: auto; padding: 24px 32px; }
  #detail .empty { color: var(--muted); font-size: 13px; margin-top: 40px; text-align: center; }
  #detail h2 { font-size: 17px; margin: 0 0 4px; }
  #detail .expr-id { font-size: 12px; color: var(--muted); font-family: monospace; margin-bottom: 4px; }
  #detail .prompt {
    font-size: 13px; color: var(--muted); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 12px 0 24px;
    white-space: pre-wrap;
  }
  .rail { position: relative; padding-left: 28px; }
  .rail::before {
    content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px;
    background: var(--border);
  }
  .step {
    position: relative; margin-bottom: 18px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
  }
  .step::before {
    content: ""; position: absolute; left: -24px; top: 16px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--pending); border: 2px solid var(--panel);
    box-shadow: 0 0 0 2px var(--border);
  }
  .step.executing::before { background: var(--executing); animation: pulse 1.4s infinite; }
  .step.done::before { background: var(--done); box-shadow: 0 0 0 2px var(--done); }
  .step.blocked::before { background: var(--blocked); box-shadow: 0 0 0 2px var(--blocked); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 2px var(--border); }
    50% { box-shadow: 0 0 0 5px rgba(37,99,235,.25); }
    100% { box-shadow: 0 0 0 2px var(--border); }
  }
  .step-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .step-title { font-size: 13.5px; font-weight: 600; }
  .status-tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; }
  .status-tag.pending { background: rgba(156,163,175,.15); color: var(--pending); }
  .status-tag.executing { background: rgba(37,99,235,.15); color: var(--executing); }
  .status-tag.done { background: rgba(22,163,74,.15); color: var(--done); }
  .status-tag.blocked { background: rgba(220,38,38,.15); color: var(--blocked); }
  .step-detail, .step-note { font-size: 12px; color: var(--muted); margin-top: 6px; white-space: pre-wrap; }
  .step-note { color: var(--text); border-left: 2px solid var(--accent); padding-left: 8px; margin-top: 8px; }
  .step-acc { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .step-acc b { color: var(--muted); }
  details.trace { margin-top: 24px; }
  details.trace summary { cursor: pointer; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  details.trace pre {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; font-size: 12px; white-space: pre-wrap; overflow-x: auto;
  }
</style>
</head>
<body>
<header>
  <h1>step-relay 任务看板</h1>
  <div class="refresh" id="refresh">刷新</div>
</header>
<main>
  <div id="task-list"></div>
  <div id="detail"><div class="empty">选择左侧任务查看 Step List 与状态</div></div>
</main>
<script>
  let tasks = [];
  let activeId = null;
  let traceOpen = false;

  async function loadTasks() {
    const res = await fetch('/api/tasks');
    tasks = await res.json();
    renderTaskList();
    if (activeId) loadDetail(activeId);
  }

  function renderTaskList() {
    const el = document.getElementById('task-list');
    el.innerHTML = tasks.map(t => `
      <div class="task-item ${t.exprId === activeId ? 'active' : ''}" data-id="${t.exprId}">
        <div class="title">${escapeHtml(t.title)}</div>
        <div class="meta">
          <span class="badge ${t.status}">${t.status}</span>
          <span>${t.progress}</span>
        </div>
      </div>
    `).join('') || '<div class="empty" style="padding:16px;font-size:12px;">暂无任务</div>';
    el.querySelectorAll('.task-item').forEach(node => {
      node.addEventListener('click', () => {
        activeId = node.dataset.id;
        renderTaskList();
        loadDetail(activeId);
      });
    });
  }

  async function loadDetail(exprId) {
    const res = await fetch('/api/tasks/' + encodeURIComponent(exprId));
    if (!res.ok) return;
    const data = await res.json();
    renderDetail(data);
  }

  function renderDetail(d) {
    const stepsHtml = d.steps.map(s => `
      <div class="step ${s.status}">
        <div class="step-head">
          <span class="step-title">${s.id}. ${escapeHtml(s.title)}</span>
          <span class="status-tag ${s.status}">${s.status}</span>
        </div>
        ${s.detail ? `<div class="step-detail">${escapeHtml(s.detail)}</div>` : ''}
        ${s.acceptance ? `<div class="step-acc"><b>验收:</b> ${escapeHtml(s.acceptance)}</div>` : ''}
        ${s.note ? `<div class="step-note">${escapeHtml(s.note)}</div>` : ''}
      </div>
    `).join('') || '<div class="empty">尚未定义 Step List</div>';

    document.getElementById('detail').innerHTML = `
      <h2>${escapeHtml(d.title)}</h2>
      <div class="expr-id">${d.exprId} · <span class="badge ${d.status}">${d.status}</span></div>
      ${d.prompt ? `<div class="prompt">${escapeHtml(d.prompt)}</div>` : ''}
      <div class="rail">${stepsHtml}</div>
      <details class="trace" ${traceOpen ? 'open' : ''}>
        <summary>三方轨迹（Markdown 原文）</summary>
        <pre>${escapeHtml(d.trace || '')}</pre>
      </details>
    `;
    document.querySelector('#detail details.trace')
      .addEventListener('toggle', (e) => { traceOpen = e.target.open; });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  document.getElementById('refresh').addEventListener('click', loadTasks);
  loadTasks();
  setInterval(loadTasks, 5000);
</script>
</body>
</html>
